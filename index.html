<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aura Fresh — fresh Myanmar groceries delivered across Yangon." />
    <meta name="theme-color" content="#2D6A4F" />
    <meta name="application-name" content="Aura Fresh" />
    <meta name="apple-mobile-web-app-title" content="Aura Fresh" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Aura Fresh</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint (mirrors src/lib/theme.ts).
      (function () {
        try {
          var saved = localStorage.getItem('aura-fresh-theme-v3') ? localStorage.getItem('aura-fresh-theme') : 'auto';
          var hour = new Date().getHours();
          var dark = saved === 'dark' || (saved !== 'light' && (hour < 6 || hour >= 18));
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
